# For given branch ( as of now develop, player-demo.hexaglobe-net)
# 1. Will run build-prod command to generate a dist folder(minified version of code) up to date with source code.
# 2. Will run build-demo to generate the demo site in folder dist/demo
# 2. Will upload the demo site to webserver configured in gitlab settings.
image: ubuntu:20.04

# Run build-prod and commit then push generate files.
# Run build-demo to generate demo site
before_script:
  - source ./resources/gitlab/.${CI_COMMIT_REF_NAME}.env
  - apt-get update -qy
  - apt-get install --no-install-suggests -y lftp wget jq sshpass
  - wget -qO- https://deb.nodesource.com/setup_16.x | bash -
  - export VERSION=$(jq -r .version package.json)
  - apt-get install -y nodejs git
  - npm install
  - npm run build-prod
  - npm run build-demo

# Send the content of the dist/demo folder to the $TARGET_DIRECTORY(configured in resources/gitlab/{branch-name}.env
# on the ftp server $SFTP_ADDR:$SFTP_PORT (configured in Gitlab-> settings ->CI/CD)
deploy_demo_develop: # Sync to FTP
  tags:
    - hexaplayer
  stage: deploy
  # CI only done when pushing on branch listed below
  only:
    - develop
  script:
    - lftp -e "debug 5; set sftp:use-full-path no; set sftp:auto-confirm yes; set sftp:connect-program \"ssh -a -x -o 'StrictHostKeyChecking accept-new'\"; open sftp://$SFTP_ADDR:$SFTP_PORT; user $SFTP_USERNAME $SFTP_PASSWORD; mirror -X .* -X .*/ --reverse --verbose --delete ./dist/demo $TARGET_DIRECTORY ; bye"
    - sshpass -p "$CDN_PREPROD_PASS" ssh -o StrictHostKeyChecking=no -v -p 5142  $CDN_PREPROD_USER@$CDN_PREPROD_ADDR "cd $CDN_PREPROD_TARGET_DIRECTORY;/usr/local/bin/deploy_cdn_test.sh $VERSION"
    - sshpass -p "$CDN_PREPROD_PASS" scp -o StrictHostKeyChecking=no -v -P 5142 dist/HPlayer.bundle.js $CDN_PREPROD_USER@$CDN_PREPROD_ADDR:$CDN_PREPROD_TARGET_DIRECTORY/$VERSION
    - sshpass -p "$CDN_PREPROD_PASS" scp -o StrictHostKeyChecking=no -v -P 5142 dist/index.css $CDN_PREPROD_USER@$CDN_PREPROD_ADDR:$CDN_PREPROD_TARGET_DIRECTORY/$VERSION


deploy_demo_prod:
  tags:
    - hexaplayer
  stage: deploy
  only:
    - player-demo.hexaglobe-net
  script:
    - lftp -e "debug 5; set sftp:use-full-path no; set sftp:auto-confirm yes; set sftp:connect-program \"ssh -a -x -o 'StrictHostKeyChecking accept-new'\"; open sftp://$SFTP_ADDR:$SFTP_PORT; user $SFTP_USERNAME $SFTP_PASSWORD; mirror -X .* -X .*/ --reverse --verbose --delete ./dist/demo $TARGET_DIRECTORY ; bye"
